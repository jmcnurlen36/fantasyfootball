# fly.toml app configuration file for kicker-bet
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kicker-bet'
primary_region = 'ewr'

[build]

[env]
  DATA_DIR = '/data'
  NOT_IN_BET = 'Jen,Mike,Stephen,Alicia'
  REFRESH_HOURS = '6'
  YAHOO_LEAGUE_ID = '746192'
  YAHOO_REDIRECT_URI = 'https://localhost:8080'

[[mounts]]
  source = 'kicker_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
