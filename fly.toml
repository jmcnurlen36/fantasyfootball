# Change the app name if "kicker-bet" is taken (fly launch will tell you).
app = "kicker-bet"
primary_region = "ewr"

[env]
  DATA_DIR = "/data"
  YAHOO_LEAGUE_ID = "746192"
  YAHOO_REDIRECT_URI = "https://localhost:8080"
  REFRESH_HOURS = "6"
  NOT_IN_BET = "Jen,Mike,Stephen,Alicia"

[mounts]
  source = "kicker_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Stay running so the 6-hourly refresh keeps happening.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
